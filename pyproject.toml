[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel"]

[project]
authors = [
  {name = "rwydaegh", email = "robin.wydaeghe@ugent.be"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "numpy<2",
  "pandas",
  "scipy",
  "gdown",
  "seaborn",
  "matplotlib",
  "line-profiler",
  "pytest",
  "scienceplots",
  "PySide6",
  "osparc",
  "colorama",
  "python-dotenv",
  "psutil",
  "h5py",
  "requests",
  "openpyxl",
  "tqdm",
  "dask[array]",
  "pywin32; sys_platform == 'win32'",
]
description = "A Python framework for dosimetric assessments using Sim4Life."
keywords = [
  "emf",
  "dosimetry",
  "sar",
  "sim4life",
  "electromagnetic",
  "simulation",
  "near-field",
  "far-field",
  "phantom",
  "antenna",
]
license = {text = "Apache-2.0"}
name = "goliat"
readme = "README.md"
requires-python = ">=3.8"
version = "1.4.0"

[project.optional-dependencies]
ai = [
  "openai>=1.0.0",
  "rich>=13.0.0",
]
docs = [
  "mkdocs",
  "mkdocs-material==9.5.3",
  "pymdown-extensions==10.7",
  "mkdocstrings[python]",
  "mkdocs-mermaid2-plugin",
  "mkdocs-panzoom-plugin",
  "mkdocs-git-revision-date-localized-plugin",
  "mkdocs-minify-plugin",
  "mkdocs-kroki-plugin",
  "mknotebooks>=0.8.0",
  "ansi2html>=1.8.0",
]

[project.scripts]
goliat = "cli.__main__:main"

[project.urls]
Documentation = "https://docs.goliat.waves-ugent.be/"
Homepage = "https://docs.goliat.waves-ugent.be/"
Issues = "https://github.com/rwydaegh/goliat/issues"
Repository = "https://github.com/rwydaegh/goliat"

[tool.codespell]
ignore-words-list = "Studi"
skip = "docs/img/waves.svg"

[tool.pyright]
exclude = [
  "analysis",
  "tests",
  "scripts",
  "cli",
]
pythonVersion = "3.11"
reportMissingImports = false
reportMissingModuleSource = false

[tool.pytest.ini_options]
markers = [
  "skip_on_ci: mark a test to be skipped in CI environments (e.g., GitHub Actions)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py38"

[tool.ruff.format]
exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "_build",
  "buck-out",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
packages = {find = {exclude = ["scripts*", "tests*", "cloud_setup*"]}}

[tool.setuptools.package-data]
goliat = [
  "config/defaults/*.json",
  "config/defaults/material_name_mapping.json",
]
