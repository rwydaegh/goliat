name: Release

on:
  push:
    tags:
    - v[0-9]+.[0-9]+.[0-9]+

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout tagged source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Verify tag and release metadata
      shell: bash
      run: |
        git fetch origin master
        git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
          echo "Release tag must point to a commit on master." >&2
          exit 1
        }

        python - <<'PY'
        import os
        import pathlib
        import re
        import tomllib

        version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
        pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
        citation = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")
        readme = pathlib.Path("README.md").read_text(encoding="utf-8")
        changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

        actual = {
            "pyproject.toml": pyproject["project"]["version"],
            "CITATION.cff": re.search(r"(?m)^version:\s*([^\s]+)", citation).group(1),
            "README.md": re.search(r"version\s*=\s*\{([^}]+)\}", readme).group(1),
        }
        mismatches = {name: value for name, value in actual.items() if value != version}
        if mismatches:
            raise SystemExit(f"Tag v{version} disagrees with release metadata: {mismatches}")
        if not re.search(rf"(?m)^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}$", changelog):
            raise SystemExit(f"CHANGELOG.md has no dated [{version}] release section")
        PY

    - name: Build and validate distributions
      run: |
        python -m pip install --upgrade build twine
        python -m build
        python -m twine check dist/*

    - name: Create or update draft GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        else
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
        fi

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload --skip-existing dist/*

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
